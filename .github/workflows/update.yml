name: Update v2rayN working subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: v2rayn-hourly-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Collect fresh VLESS candidates from independent feeds
        run: |
          python3 - <<'PY'
          import urllib.request
          import base64
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qsl, unquote
          from concurrent.futures import ThreadPoolExecutor

          sources = [["Luxxuria","https://raw.githubusercontent.com/luxxuria/harvester/refs/heads/main/speed_tested.txt"],["Mehrtat","https://raw.githubusercontent.com/mehrtat/vless-collector/main/vless.txt"],["0xRadikal","https://raw.githubusercontent.com/0xRadikal/Free-v2ray-Configs/main/verified/configs.txt"]]
          def fetch(item):
              name, url = item
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "subscription-validator/1.0", "Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      raw = response.read(2000001)
                  if len(raw) > 2000000:
                      raise ValueError("feed exceeds size limit")
                  data = raw.decode("utf-8-sig").strip()
                  if "vless://" not in data:
                      data = base64.b64decode(data + "=" * (-len(data) % 4), validate=False).decode("utf-8-sig")
                  rows = [line.strip() for line in data.splitlines() if line.strip().startswith("vless://")]
                  print(f"{name}: {len(rows)} VLESS candidates", flush=True)
                  return rows
              except Exception as exc:
                  print(f"::warning::{name} failed: {exc}", flush=True)
                  return []

          def key(line):
              try:
                  u = urlsplit(line)
                  if not u.hostname or not u.username or not u.port:
                      return None
                  q = tuple(sorted(parse_qsl(u.query, keep_blank_values=True)))
                  # Retain all transports for the modern validator.
                  return (u.hostname.lower(), u.port, unquote(u.username), q)
              except ValueError:
                  return None

          with ThreadPoolExecutor(max_workers=3) as pool:
              feeds = list(pool.map(fetch, sources))
          seen = set()
          merged = []
          for rows in feeds:
              added = 0
              for line in rows:
                  k = key(line)
                  if k is None or k in seen:
                      continue
                  seen.add(k)
                  merged.append(line)
                  added += 1
                  if added >= 300:
                      break
          if not merged:
              raise SystemExit("No usable upstream candidates; previous subscription is preserved")
          Path("speed_tested.txt").write_text("\n".join(merged) + "\n", encoding="utf-8")
          print(f"Unique candidates: {len(merged)}")
          PY

      - name: Install Xray
        run: |
          XRAY_VERSION="v26.7.11"
          curl -fL --retry 3 \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -o /tmp/xray.zip
          unzip -q /tmp/xray.zip xray -d /tmp/xray
          chmod +x /tmp/xray/xray
          /tmp/xray/xray version

      - name: Validate, geolocate and rank VLESS servers
        run: |
          python3 scripts/validate_vless.py \
            --input speed_tested.txt \
            --xray /tmp/xray/xray \
            --working working.txt \
            --working-base64 working_base64.txt \
            --report report.tsv \
            --timeout 10 \
            --workers 20

      - name: Verify outputs
        run: |
          test -s working.txt
          test -s working_base64.txt
          test -s report.tsv
          python3 - <<'PY'
          import base64
          raw = open('working.txt','rb').read()
          enc = open('working_base64.txt','rb').read().strip()
          assert base64.b64decode(enc) == raw
          assert raw.startswith(b'vless://')
          print(f'Outputs verified: {raw.count(chr(10).encode())} servers')
          PY

      - name: Publish subscription files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add working.txt working_base64.txt report.tsv
          if git diff --cached --quiet; then
            echo "No subscription changes"
          else
            git commit -m "Update ranked v2rayN subscription"
            git push
          fi
